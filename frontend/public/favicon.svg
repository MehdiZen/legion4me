<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#0d0a14"/>

  <!-- Robe / body -->
  <path d="M22 58 C20 50 18 44 20 38 L32 34 L44 38 C46 44 44 50 42 58 Z" fill="#3a2060"/>
  <path d="M22 58 C20 50 18 44 20 38 L32 34 L44 38 C46 44 44 50 42 58 Z" stroke="#7c5cbf" stroke-width="0.8"/>

  <!-- Arms -->
  <path d="M20 38 Q12 36 10 30 Q14 28 18 34 L20 38Z" fill="#3a2060" stroke="#7c5cbf" stroke-width="0.8"/>
  <path d="M44 38 Q52 36 54 30 Q50 28 46 34 L44 38Z" fill="#3a2060" stroke="#7c5cbf" stroke-width="0.8"/>

  <!-- Staff -->
  <line x1="52" y1="58" x2="46" y2="24" stroke="#7c5cbf" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Orb on staff -->
  <circle cx="44.5" cy="22" r="3.5" fill="#c084fc" opacity="0.85"/>
  <circle cx="44.5" cy="22" r="2" fill="#e9d5ff" opacity="0.6"/>

  <!-- Head -->
  <ellipse cx="32" cy="24" rx="7" ry="8" fill="#c9a87c"/>

  <!-- Hat brim -->
  <ellipse cx="32" cy="17.5" rx="11" ry="2.5" fill="#2a1545" stroke="#7c5cbf" stroke-width="0.8"/>
  <!-- Hat cone -->
  <path d="M21 17.5 L30 2 Q32 0 34 2 L43 17.5 Z" fill="#2a1545" stroke="#7c5cbf" stroke-width="0.8"/>
  <!-- Star on hat -->
  <text x="29" y="12" font-size="6" fill="#c084fc" font-family="serif">★</text>

  <!-- Eyes (glowing) -->
  <ellipse cx="29" cy="24" rx="1.5" ry="1.5" fill="#c084fc"/>
  <ellipse cx="35" cy="24" rx="1.5" ry="1.5" fill="#c084fc"/>

  <!-- Beard -->
  <path d="M26 29 Q32 35 38 29" stroke="#d4b896" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Magic sparks near orb -->
  <circle cx="41" cy="18" r="0.8" fill="#e9d5ff" opacity="0.9"/>
  <circle cx="48" cy="20" r="0.6" fill="#c084fc" opacity="0.8"/>
  <circle cx="46" cy="17" r="0.5" fill="#ffffff" opacity="0.7"/>
</svg>
